# nginx site for the Autostrad CRM: the web app (static files) and the API under /api, on ONE https address (so no cross-origin calls).
# Install (Ubuntu):  sudo cp deploy/nginx-autostrad-crm.conf /etc/nginx/sites-available/autostrad-crm
#                    sudo sed -i 's/crm.example.com/YOUR.DOMAIN/g' /etc/nginx/sites-available/autostrad-crm
#                    sudo ln -s /etc/nginx/sites-available/autostrad-crm /etc/nginx/sites-enabled/
#                    sudo nginx -t && sudo systemctl reload nginx
# The certificate must exist first (DEPLOYMENT.md, part 5, step 4): certbot with the webroot /var/www/html on the default site.
# The API must listen on 127.0.0.1 only (API_HOST=127.0.0.1 in server/.env), so nginx is the only way in.

# the sign-in endpoint: at most 10 attempts a minute per address (the app has no lockout of its own)
limit_req_zone $binary_remote_addr zone=autostrad_login:10m rate=10r/m;

server {
  listen 80;
  listen [::]:80;
  server_name crm.example.com;

  location /.well-known/acme-challenge/ { root /var/www/html; }   # certificate renewals
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name crm.example.com;

  ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  root /srv/autostrad-crm/web/dist;
  index index.html;
  client_max_body_size 2m;                                         # the API accepts bodies up to 2 MB

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # add_header Strict-Transport-Security "max-age=31536000" always;   # switch on once https works for good

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /api/auth/login {
    limit_req zone=autostrad_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # built files have a hash in their name: keep them for a year; the page that names them is never cached
  location /assets/ { expires 1y; try_files $uri =404; }
  location = /index.html { expires -1; }

  # every other address is a screen of the web app
  location / { try_files $uri /index.html; }
}
